name: Temporary YouTube Channel Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: github.head_ref == 'temp-youtube-research-20260711' || github.ref_name == 'temp-youtube-research-20260711'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pillow yt-dlp
      - name: Generate Sleduck grids
        run: python tools/youtube_sleduck_grids.py
      - name: Upload grids artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-sleduck-grids
          path: sleduck_grids/
          retention-days: 3
