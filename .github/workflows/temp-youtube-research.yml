name: Temporary YouTube Channel Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: github.head_ref == 'temp-youtube-research-20260711' || github.ref_name == 'temp-youtube-research-20260711'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests pillow
      - name: Diagnose YouTube responses
        run: |
          mkdir -p debug_output
          python tools/youtube_debug_one.py | tee debug_output/diagnostic.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: youtube-diagnostic
          path: debug_output/
          retention-days: 1
