name: Temporary YouTube discovery round 2

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp requests pillow
      - name: Run second-round discovery
        working-directory: youtube_verify
        run: |
          mkdir -p round2_output
          python discover_round2.py > round2_output/run.log 2>&1 || true
          tail -250 round2_output/run.log
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-round2-evidence
          path: youtube_verify/round2_output
          if-no-files-found: warn
          retention-days: 3
