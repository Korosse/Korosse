name: Temporary YouTube date verification

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp requests
      - name: Verify current publication dates and contacts
        working-directory: youtube_verify
        run: |
          mkdir -p dates_output
          sed -i "s/data = json.loads(r.stdout) if r.stdout.strip() else {}/data = (json.loads(r.stdout) if r.stdout.strip() else {}) or {}/" collect_dates.py
          python collect_dates.py > dates_output/run.log 2>&1 || true
          cat dates_output/run.log
      - name: Upload date evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-date-evidence
          path: youtube_verify/dates_output
          if-no-files-found: warn
          retention-days: 3
