name: Temporary Invidious instance discovery

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  find-instances:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U requests
      - name: Test public Invidious APIs
        working-directory: youtube_verify
        run: |
          mkdir -p instance_output
          python find_invidious_instances.py > instance_output/run.log 2>&1 || true
          tail -250 instance_output/run.log
      - name: Upload instance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invidious-instance-report
          path: youtube_verify/instance_output
          if-no-files-found: warn
          retention-days: 3
