name: Temporary YouTube channel HTML probe

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U requests
      - name: Probe raw Shorts tab data
        working-directory: youtube_verify
        run: |
          mkdir -p channel_html_probe_output
          python channel_html_probe.py > channel_html_probe_output/run.log 2>&1 || true
          tail -250 channel_html_probe_output/run.log
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-html-probe
          path: youtube_verify/channel_html_probe_output
          if-no-files-found: warn
          retention-days: 3
