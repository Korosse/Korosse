name: Temporary YouTube date probe

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp requests
      - name: Probe date sources
        working-directory: youtube_verify
        run: |
          mkdir -p date_probe_output
          python date_probe.py > date_probe_output/run.log 2>&1 || true
          tail -200 date_probe_output/run.log
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-date-probe
          path: youtube_verify/date_probe_output
          if-no-files-found: warn
          retention-days: 3
