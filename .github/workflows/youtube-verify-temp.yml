name: Temporary YouTube near-pass recheck

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp requests pillow
      - name: Recheck publication dates and visual grids
        working-directory: youtube_verify
        run: |
          mkdir -p base44_output
          python recheck_base44.py > base44_output/run.log 2>&1 || true
          tail -200 base44_output/run.log
      - name: Upload recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-base44-evidence
          path: youtube_verify/base44_output
          if-no-files-found: warn
          retention-days: 3
