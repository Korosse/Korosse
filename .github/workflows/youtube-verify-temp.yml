name: Temporary cross-OS YouTube player probe

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official YouTube player endpoint
        working-directory: youtube_verify
        shell: bash
        run: |
          mkdir -p cross_os_probe_output
          python cross_os_player_probe.py > cross_os_probe_output/run-${{ matrix.os }}.log 2>&1 || true
          cat cross_os_probe_output/run-${{ matrix.os }}.log
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-cross-os-probe-${{ matrix.os }}
          path: youtube_verify/cross_os_probe_output
          if-no-files-found: warn
          retention-days: 3
