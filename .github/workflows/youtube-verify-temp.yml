name: Temporary Invidious 44-channel verification

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp requests
      - name: Verify 44 channels through Invidious
        working-directory: youtube_verify
        run: |
          mkdir -p inv44_output
          python invidious_recheck44.py > inv44_output/run.log 2>&1 || true
          tail -200 inv44_output/run.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-inv44-evidence
          path: youtube_verify/inv44_output
          if-no-files-found: warn
          retention-days: 3
