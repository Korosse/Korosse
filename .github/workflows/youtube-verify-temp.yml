name: Temporary slow Invidious verification

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U requests
      - name: Verify channels sequentially
        working-directory: youtube_verify
        run: |
          mkdir -p inv44_slow_output
          python inv44_slow.py > inv44_slow_output/run.log 2>&1 || true
          tail -200 inv44_slow_output/run.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-inv44-slow-evidence
          path: youtube_verify/inv44_slow_output
          if-no-files-found: warn
          retention-days: 3
