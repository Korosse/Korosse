name: Temporary yt-dlp approximate-date probe

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp
      - name: Probe Shorts approximate dates
        working-directory: youtube_verify
        run: |
          mkdir -p approx_date_output
          python approx_date_probe.py > approx_date_output/run.log 2>&1 || true
          cat approx_date_output/run.log
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-approx-date-probe
          path: youtube_verify/approx_date_output
          if-no-files-found: warn
          retention-days: 3
