name: Temporary YouTube search activity probe

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U requests
      - name: Probe date-sorted YouTube search
        working-directory: youtube_verify
        run: |
          mkdir -p search_activity_probe_output
          python search_channel_activity_probe.py > search_activity_probe_output/run.log 2>&1 || true
          cat search_activity_probe_output/run.log
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-search-activity-probe
          path: youtube_verify/search_activity_probe_output
          if-no-files-found: warn
          retention-days: 3
