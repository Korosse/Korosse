name: Temporary YouTube broad discovery

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp requests pillow
      - name: Discover and verify channels
        working-directory: youtube_verify
        run: |
          mkdir -p discovery_output
          python discover_channels.py > discovery_output/run.log 2>&1 || true
          tail -200 discovery_output/run.log
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-discovery-evidence
          path: youtube_verify/discovery_output
          if-no-files-found: warn
          retention-days: 3
