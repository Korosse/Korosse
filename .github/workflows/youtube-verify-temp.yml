name: Temporary YouTube RSS verification

on:
  push:
    branches:
      - chatgpt-youtube-verify-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U yt-dlp requests
      - name: Verify current Shorts activity through RSS
        working-directory: youtube_verify
        run: |
          mkdir -p rss_output
          python collect_rss.py > rss_output/run.log 2>&1 || true
          cat rss_output/run.log
      - name: Upload RSS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-rss-evidence
          path: youtube_verify/rss_output
          if-no-files-found: warn
          retention-days: 3
