name: Manual YouTube channel research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests
      - name: Debug YouTube metadata
        run: python debug_video_html.py
      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-html-debug
          path: debug_output
          if-no-files-found: warn
